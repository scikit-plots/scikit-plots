# Credentials in scripts, config files, notebooks and logs.
#
# A secret's field rule matches on the key's final token, so DB_PASSWORD,
# stripe_api_key and GITHUB_TOKEN are all hidden by `password`, `api_key` and
# `token`, whatever the value looks like.
#
# Every positive example here is written as fragments, which the loader joins:
# ['sk_live_', '0123...'] is tested as sk_live_0123... . A whole example would
# be a credential-shaped string in a committed file, which secret scanners
# block at push and at publish. `packs --compile` refuses one (invariant I14).
name: secrets
version: 1
summary: Passwords, tokens, API keys and connection strings in code and configuration.

fields:
  - names: [password, passwd, pwd, pass, passphrase, secret, secret_key, client_secret, token, access_token, refresh_token, id_token, auth_token, bearer_token, api_key, apikey, private_key, account_key, access_key, secret_access_key, credentials, credential, auth, authorization, cookie, session_id, connection_string, dsn, database_url, webhook_url]
    kind: SECRET
    role: id

patterns:
  - kind: STRIPE_KEY
    pattern: '\b(?:sk|rk|pk)_(?:live|test)_[0-9A-Za-z]{16,}\b'
    intent: A Stripe API key.
    priority: 96
    examples_yes: [['sk_live_', '0123456789abcdefABCDEFGH']]
    examples_no: ['sk_live_short']
  - kind: GITHUB_TOKEN
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'
    intent: A GitHub personal, OAuth, user, server or refresh token.
    priority: 96
    examples_yes: [['ghp_', '0123456789abcdefghijklmnopqrstuvwxyZ']]
    examples_no: ['ghp_tooshort']
  - kind: SLACK_TOKEN
    pattern: '\bxox[abprs]-[0-9A-Za-z-]{10,}\b'
    intent: A Slack bot, user or app token.
    priority: 96
    examples_yes: [['xoxb-', '1234567890-abcdefghij']]
    examples_no: ['xoxb-short']
  - kind: GOOGLE_API_KEY
    pattern: '\bAIza[0-9A-Za-z_\-]{35}\b'
    intent: A Google Cloud API key.
    priority: 96
    examples_yes: [['AIza', 'SyA1234567890abcdefghijklmnopqrstuv']]
    examples_no: ['AIzaShort']
  - kind: BEARER_TOKEN
    pattern: '(?i)\bbearer\s+(?P<value>[A-Za-z0-9._~+/-]{20,}=*)'
    intent: An HTTP bearer credential, as it appears in a curl command or a header dump.
    priority: 94
    examples_yes: [['Bearer ', 'abcdefghijklmnopqrstuvwxyz0123']]
    examples_no: ['bearer of bad news']
  - kind: URL_CREDENTIALS
    pattern: '\b[a-z][a-z0-9+.\-]{1,15}://[^\s:/@"'']+:[^\s@/"'']+@[^\s/"'']+'
    intent: A connection string or URL carrying a user name and password.
    priority: 95
    examples_yes: [['postgres://marion:', 'hunter2@db.example.invalid:5432']]
    examples_no: ['https://example.com/a:b', 'postgres://db.example.invalid:5432']
  - kind: PRIVATE_KEY_BLOCK
    pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    intent: The header of a PEM private key, so a pasted key is refused even when truncated.
    priority: 97
    examples_yes: [['-----BEGIN OPENSSH ', 'PRIVATE KEY-----'], ['-----BEGIN ', 'PRIVATE KEY-----']]
    examples_no: ['-----BEGIN CERTIFICATE-----']
