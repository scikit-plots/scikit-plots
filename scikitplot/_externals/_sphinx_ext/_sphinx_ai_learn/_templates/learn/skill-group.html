<div class="learn-prompt-group" data-skill-controls data-site="{{ site_id|e }}">
<p>Apply reusable community skills to this topic.</p>
<p>Enabled skills appear in their own generated-result sections below this one.</p>
<h4>Reusable Skills</h4>
<div class="learn-prompt-toggle-list">
{% for skill in skills %}
<div class="learn-prompt-toggle-row">
<a class="learn-prompt-link" target="_blank" rel="noopener" href="{{ skill.href|e }}">{{ skill.title|e }} <span aria-hidden="true">↗</span></a>
<label class="learn-switch" title="Show on topic pages">
<input type="checkbox" data-skill-toggle="{{ skill.id|e }}" data-default="{{ 'true' if skill.default_enabled else 'false' }}" aria-label="Show {{ skill.title|e }} on topic pages">
<span aria-hidden="true"><span>off</span><span>on</span></span>
</label>
</div>
{% endfor %}
</div>
<div class="learn-actions next-steps-container">
<a class="learn-button next-step-button learn-view-all-prompts" target="_blank" rel="noopener" href="{{ skills_href|e }}">
<svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M2 5h8M2 10h13M2 15h8M15 14l3 3m0 0-3 3m3-3H9"/></svg>
<span class="message-action-button-text">View All Skills</span>
</a>
</div>
</div>
