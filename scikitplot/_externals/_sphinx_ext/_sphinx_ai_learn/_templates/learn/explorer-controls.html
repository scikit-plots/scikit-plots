<form class="learn-trending-controls learn-explorer-controls" data-explorer-controls>
  {% include "learn/explorer-search-primary.html" %}
  <div id="{{ filter_panel_id|e }}" class="learn-filter-options" data-explorer-filter-options>
    <label>Category
      <select name="category">
        <option value="">All categories</option>
        {% for tag in tags %}<option value="{{ tag|e }}">{{ tag|replace('-', ' ')|title|e }}</option>{% endfor %}
      </select>
    </label>
    <label>Timeframe
      <select name="timeframe">
        <option value="all">All time</option>
        <option value="7d">Last 7 days</option>
        <option value="14d">Last 14 days</option>
        <option value="30d">Last 30 days</option>
        <option value="365d">Last year</option>
      </select>
    </label>
    <label>Sort by
      <select name="sort" data-explorer-sort>
        {% for option in sort_options %}<option value="{{ option.value|e }}">{{ option.label|e }}</option>{% endfor %}
      </select>
    </label>
    {% set display_name = "limit" %}
    {% include "learn/display-size-select.html" %}
    <button type="button" class="learn-sort-direction" data-explorer-direction aria-label="Reverse sort order">↓ Desc</button>
    <button type="button" data-explorer-reset>Reset</button>
  </div>
</form>
