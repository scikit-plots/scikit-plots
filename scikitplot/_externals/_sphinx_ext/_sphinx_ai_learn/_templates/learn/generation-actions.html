<div class="learn-generation-actions learn-generation-action-bar" data-generation-actions data-generation-actions-kind="{{ generation_kind|e }}">
  <button type="submit" class="learn-primary learn-generation-action learn-generation-action--primary" data-generation-submit data-{{ generation_kind|e }}-submit>Generate Now</button>
  <button type="button" class="learn-generation-secondary learn-generation-action" data-generation-save-draft data-{{ generation_kind|e }}-save-draft>Save draft</button>
  <button type="button" class="learn-generation-secondary learn-generation-action" data-generation-copy-request data-{{ generation_kind|e }}-copy-request>Copy request</button>
</div>
