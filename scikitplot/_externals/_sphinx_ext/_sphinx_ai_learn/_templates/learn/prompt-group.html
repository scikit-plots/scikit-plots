<div class="learn-prompt-group" data-prompt-controls data-site="{{ site_id|e }}">
<p>Create and browse community prompts that you can run on this topic with one click.</p>
<p>Enabled prompts will appear in their own sections below this one.</p>
<h4>Community Prompts</h4>
<div class="learn-prompt-toggle-list">
{% for prompt in prompts %}
<div class="learn-prompt-toggle-row">
<a class="learn-prompt-link" target="_blank" rel="noopener" href="{{ prompt.href|e }}">{{ prompt.title|e }} <span aria-hidden="true">↗</span></a>
<label class="learn-switch" title="Show on topic pages">
<input type="checkbox" data-prompt-toggle="{{ prompt.id|e }}" data-default="{{ 'true' if prompt.default_enabled else 'false' }}" aria-label="Show {{ prompt.title|e }} on topic pages">
<span aria-hidden="true"><span>off</span><span>on</span></span>
</label>
</div>
{% endfor %}
</div>
<div class="learn-actions next-steps-container">
<a class="learn-button next-step-button learn-view-all-prompts" target="_blank" rel="noopener" href="{{ prompts_href|e }}">
<svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M2 5h8M2 10h13M2 15h8M15 14l3 3m0 0-3 3m3-3H9"/></svg>
<span class="message-action-button-text">View All Prompts</span>
</a>
</div>
</div>
