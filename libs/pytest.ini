# Configuration for the tests of the partial-distribution tooling (libs/_tools).
#
# It exists so that `pytest libs/_tools/tests` does not pick up the
# repository's own pytest.ini, which loads plugins that belong to the full
# package (Sphinx fixtures among them). The tooling tests need pytest alone.
[pytest]
minversion = 7.1.2
testpaths = _tools/tests
xfail_strict = true
addopts = -ra --strict-config --strict-markers
filterwarnings =
    error
