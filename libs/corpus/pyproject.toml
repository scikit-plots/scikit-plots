[project]
name = "scikit-plots-corpus"
version = "0.5.dev0"
description = "Document ingestion, chunking, embedding and retrieval pipeline from scikit-plots."
readme = {file = "README_CORPUS.md", content-type = "text/markdown"}
requires-python = ">=3.9"
dynamic = ["license"]
authors = [
  {email = "scikit-plots-dev@googlegroups.com", name = "scikit-plots developers"},
]
maintainers = [
  {email = "scikit-plots-maintainers@googlegroups.com", name = "scikit-plots developers"},
]
keywords = [
  "scikit-plots",
  "corpus",
  "rag",
  "chunking",
  "embeddings",
  "retrieval",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "scikit-plots-skinny>=0.5.dev0",
  "numpy>=1.20,!=1.24.0; python_version < \"3.9\"",
  "numpy <= 2.4.6; python_version == '3.13'",
  "numpy>=2.0.0; python_version >= \"3.9\" and python_version != \"3.13\"",
]

[project.optional-dependencies]
corpus = [
  "lxml",
  "nltk",
  "gensim",
  "datasets",
  "langdetect",
  "pytesseract",
  "whisper",
  "faster-whisper",
  "openai-whisper",
  "youtube-transcript-api",
  "pypdf",
  "pdfminer",
  "pdfminer.six",
  "sentence-transformers",
  "langchain-core",
]
annoy = [
  "scikit-plots-annoy>=0.5.dev0",
]

[project.urls]
homepage = "https://scikit-plots.github.io"
repository = "https://github.com/scikit-plots/scikit-plots"
