[project]
name = "scikit-plots-sphinx-ext"
version = "0.5.dev0"
description = "The Sphinx extensions of the scikit-plots documentation, installable on their own for any Sphinx project."
readme = {file = "README_SPHINX-EXT.md", content-type = "text/markdown"}
requires-python = ">=3.8"
dynamic = ["license"]
authors = [
  {email = "scikit-plots-dev@googlegroups.com", name = "scikit-plots developers"},
]
maintainers = [
  {email = "scikit-plots-maintainers@googlegroups.com", name = "scikit-plots developers"},
]
keywords = [
  "scikit-plots",
  "sphinx",
  "documentation",
  "extension",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Framework :: Sphinx :: Extension",
]
dependencies = [
  "scikit-plots-skinny>=0.5.dev0",
  "sphinx",
]

[project.optional-dependencies]
ai-assistant = [
  "beautifulsoup4",
  "httpx",
  "markdownify",
]
collection = [
  "pyyaml",
  "sphinx-design",
]
feedback = [
  "httpx",
]
gallery-grid = [
  "sphinx-design",
]
gallery-jupyterlite = [
  "sphinx-gallery",
]
llm = [
  "sphinx-markdown-builder",
]
youtube-gallery = [
  "defusedxml",
  "pyyaml",
]
proxy = [
  "cryptography",
  "fastapi",
  "httpx",
  "huggingface_hub",
  "pandas",
  "redis",
  "starlette",
  "tomli; python_version < \"3.11\"",
  "typing_extensions",
]

[project.urls]
homepage = "https://scikit-plots.github.io"
repository = "https://github.com/scikit-plots/scikit-plots"
download = "https://github.com/scikit-plots/scikit-plots/tags"
changelog = "https://scikit-plots.github.io/dev/whats_new/index.html"
documentation = "https://scikit-plots.github.io"
issues = "https://github.com/scikit-plots/scikit-plots/issues"

[project.entry-points."scikitplot.parts.api1"]
"_externals._sphinx_ext" = "scikitplot._externals._sphinx_ext"

[tool.setuptools]
# Files are listed explicitly by setup.py; MANIFEST.in decides the sdist only.
include-package-data = false
