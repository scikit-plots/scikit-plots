#
# Windows ARM64 build dependencies: LLVM (clang-cl, flang), the Visual Studio
# C++ tools, and pkg-config.
#
# USER NOTES
#   Use it as one step of a job that runs on `windows-11-arm`:
#
#       - uses: $/.github/windows_arm64_steps
#
#   Afterwards CC, CXX, FC and PKG_CONFIG are set for the rest of the job and
#   the LLVM and pkgconf directories are on PATH. Inputs, outputs and what to
#   do when a step fails are described in README.md, next to this file.
#
# DEVELOPER NOTES
#   * The logic is in windows_arm64.ps1 and is tested by
#     tests/test_windows_arm64.ps1, which runs on any system with PowerShell 7.
#     This file only passes inputs and calls one function per step.
#   * No Visual Studio path is written anywhere. In September 2026 the
#     `windows-11-arm` label moved from Visual Studio 2022 to Visual Studio
#     2026, the directory "2022\Enterprise" became "18\Enterprise", and the
#     hard-coded path that used to be here stopped every ARM64 wheel build.
#     Visual Studio is now located with vswhere.
#   * Inputs reach the scripts through `env`, never through `${{ }}` inside
#     `run`, so that a value cannot become part of the script text.
#
# Which flag style a compiler takes (kept from the previous version):
#   cl        MSVC style: /O2 /fp:precise
#   clang-cl  MSVC style only
#   clang     GCC style
#   gcc       GCC style
#
# Sources:
#   https://github.com/actions/runner-images/issues/14602        (the label change)
#   https://github.com/actions/runner-images/blob/main/images/windows/Windows11-VS2026-Arm64-Readme.md
#   https://github.com/microsoft/vswhere/wiki/Find-VC
#   https://learn.microsoft.com/en-us/cpp/build/building-on-the-command-line
#   https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action
name: Build Dependencies (Win-ARM64)
description: "LLVM (clang-cl, flang), Visual Studio C++ tools and pkg-config for Windows ARM64 builds"

inputs:
  llvm-version:
    description: "LLVM release to install, for example 20.1.8"
    required: false
    default: "20.1.8"
  llvm-sha256:
    description: "SHA-256 of LLVM-<llvm-version>-woa64.exe; change it together with llvm-version"
    required: false
    default: "7c4ac97eb2ae6b960ca5f9caf3ff6124c8d2a18cc07a7840a4d2ea15537bad8e"
  msvc-environment:
    description: >-
      detect: locate Visual Studio and check it, leave the environment as it is (default).
      import: also run vcvarsall.bat and pass its environment (INCLUDE, LIB, PATH, ...) to later steps.
    required: false
    default: "detect"
  self-test:
    description: "true: run the tests of the setup script on this runner before using it"
    required: false
    default: "false"

outputs:
  llvm-bin:
    description: "Directory of clang-cl and flang"
    value: ${{ steps.llvm.outputs.llvm-bin }}
  fortran-compiler:
    description: "Name of the Fortran compiler selected: flang-new or flang"
    value: ${{ steps.llvm.outputs.fortran-compiler }}
  vs-installation-path:
    description: "Root of the Visual Studio installation that was found"
    value: ${{ steps.msvc.outputs.vs-installation-path }}
  vs-version:
    description: "Version of that Visual Studio, for example 18.8.12023.21"
    value: ${{ steps.msvc.outputs.vs-version }}
  msvc-tools-version:
    description: "Default MSVC toolset version of that installation; empty if it states none"
    value: ${{ steps.msvc.outputs.msvc-tools-version }}
  vcvarsall:
    description: "Full path of vcvarsall.bat"
    value: ${{ steps.msvc.outputs.vcvarsall }}
  pkg-config:
    description: "Full path of the pkg-config.exe that was installed"
    value: ${{ steps.pkgconf.outputs.pkg-config }}

runs:
  using: "composite"
  steps:
    - name: Check the runner
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') {
          throw "This action sets up Windows on ARM64; the runner is $env:RUNNER_OS $env:RUNNER_ARCH. Guard the step with: if: runner.os == 'Windows' && runner.arch == 'ARM64'"
        }
        Write-Host "Runner image: $env:ImageOS $env:ImageVersion"

    - name: Test the setup script
      if: ${{ inputs.self-test == 'true' }}
      shell: pwsh
      run: |
        & pwsh -NoLogo -NoProfile -File (Join-Path $env:GITHUB_ACTION_PATH 'tests' 'test_windows_arm64.ps1')
        if ($LASTEXITCODE -ne 0) { throw "The tests of windows_arm64.ps1 failed on this runner; see above." }

    - name: Install LLVM (clang-cl, flang)  # C, C++ and Fortran compilers with the MSVC ABI
      id: llvm
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        LLVM_SHA256: ${{ inputs.llvm-sha256 }}
      run: |
        . (Join-Path $env:GITHUB_ACTION_PATH 'windows_arm64.ps1')
        Install-Llvm -Version $env:LLVM_VERSION -Sha256 $env:LLVM_SHA256

    - name: Locate the Visual Studio C++ tools (vswhere, vcvarsall)  # headers and libraries clang-cl compiles against
      id: msvc
      shell: pwsh
      env:
        MSVC_ENVIRONMENT: ${{ inputs.msvc-environment }}
      run: |
        . (Join-Path $env:GITHUB_ACTION_PATH 'windows_arm64.ps1')
        Initialize-Msvc -Mode $env:MSVC_ENVIRONMENT

    - name: Install pkg-config (pkgconf from vcpkg)  # the one on PATH is Strawberry Perl's and is x64
      id: pkgconf
      shell: pwsh
      run: |
        . (Join-Path $env:GITHUB_ACTION_PATH 'windows_arm64.ps1')
        Install-PkgConf
