# Cross-cutting labels from changed files, for https://github.com/actions/labeler
# (v7), applied by .github/workflows/pr_labeler.yml. Module and library labels
# are generated into .github/labeler-by-module.yml; title labels into
# .github/labeler-issue.yml.
#
# This file is edited by hand. Check it after every edit:
#   python tools/maint_tools/generate_pr_labeler.py check
#   python tools/maint_tools/generate_pr_labeler.py explain <changed paths...>
#
# Semantics (actions/labeler v7, minimatch with dot: true):
#   * a bare list under a label is "any": the label applies if one entry matches;
#   * inside one changed-files list every option is a separate check (OR-ed);
#   * a "!glob" is true for every file it does not name, so it belongs only next
#     to a positive glob in all-globs-to-any-file ("docs except fragments"), or
#     alone in all-globs-to-all-files inside an "all:" group; `check` refuses
#     any other use, because it would label almost every pull request.
#   * globs use [A-Za-z0-9._-], "*", "?", whole "**" segments and one leading
#     "!"; end directory globs with "/**/*".
---

######################################################################
## Build, CI and release
######################################################################

"build/ci":
- changed-files:
  - any-glob-to-any-file:
    - .binder/*
    - .circleci/*
    - .devcontainer/**/*
    - .github/**/*
    - .spin/*
    - docker/**/*

# Generated-source templates (Tempita/meson): *.py.in, *.pyx.in, *.h.in, ...
build:templates:
- changed-files:
  - any-glob-to-any-file:
    - scikitplot/**/*.in

build:meson:
- changed-files:
  - any-glob-to-any-file:
    - pyproject.toml
    - meson.build
    - meson.options
    - meson_cpu/**/*
    - scikitplot/**/meson.build
    - setup.cfg

release:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/ci_wheels_*pypi.yml
    - docs/source/devel/maintainers/**/*

installation:
- changed-files:
  - any-glob-to-any-file:
    - docs/source/install/**/*
    - MANIFEST.in
    - pyproject.toml
    - requirements/**/*
    - setup.cfg
    - setup.py

######################################################################
## Documentation
######################################################################

# Documentation pages, but not release-note fragments (every pull request
# adds one; they are labelled by their owner module instead).
documentation:
- changed-files:
  - any-glob-to-any-file:
    - CITATION*
    - COPYING
    - LICENSE
    - LICENSE.txt
    - LICENSE.rst
    - LICENSES/*
  - all-globs-to-any-file:
    - docs/**/*
    - '!docs/source/whats_new/upcoming_changes/**/*'

DX:
- changed-files:
  - any-glob-to-any-file:
    - docs/source/devel/**/*

"doc:examples":
- changed-files:
  - any-glob-to-any-file:
    - galleries/**/*

######################################################################
## Languages
######################################################################

lang:c/c++:
- changed-files:
  - any-glob-to-any-file:
    - scikitplot/**/*.c
    - scikitplot/**/*.h
    - scikitplot/**/*.h.in
    - scikitplot/**/*.cpp
    - scikitplot/**/*.cc
    - scikitplot/**/*.hpp

lang:cython:
- changed-files:
  - any-glob-to-any-file:
    - scikitplot/**/*.pyx*
    - scikitplot/**/*.pxd*
    - scikitplot/**/*.pxi*

# Type stubs and the PEP 561 marker (not Cython: *.pyi are Python stubs).
static typing:
- changed-files:
  - any-glob-to-any-file:
    - scikitplot/**/*.pyi
    - scikitplot/**/py.typed

######################################################################
## Testing and tooling configuration
######################################################################

tests:
- changed-files:
  - any-glob-to-any-file:
    - '**/tests/**/*'
    - '**/test_*.py'
    - '**/conftest.py'
    - pytest.ini
    - codecov.yml
    - tox.ini
    - .flake8
    - .mypy.ini
    - .pre-commit-config.yaml
    - .pre-commit-hooks.yaml
    - .ruff.toml
