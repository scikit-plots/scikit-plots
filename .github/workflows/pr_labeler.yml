# Labeler Pull Request
#
# Labels pull requests from three configurations, all checked by
# tools/maint_tools/generate_pr_labeler.py (see .github/workflows/pr_check_labeler.yml):
#   .github/labeler.yml            curated cross-cutting file rules
#   .github/labeler-by-module.yml  generated module/library file rules
#   .github/labeler-issue.yml      generated title rules ("BUG: ...", "[Bug]: ...")
# Issues are labelled by .github/workflows/issue_labeler.yml with the same title
# rules; this workflow handles pull requests only.
#
# Try a change locally before pushing:
#   python tools/maint_tools/generate_pr_labeler.py explain --title "BUG: ..." <paths>
---
name: "PRs 🤖 Labeler/Notifier"

on:
  ## pull_request_target runs with the base repository's code and token, so it
  ## can label pull requests from forks. It is dangerous only together with a
  ## checkout of the pull request's code, which this workflow never does: every
  ## configuration is read through the API at the base commit. See
  ## https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    ## edited: a changed title is labelled again.
    types: [opened, reopened, synchronize, edited, ready_for_review]

## One run per pull request at a time; a newer push cancels the older run.
## Keyed by the pull-request number, not the head branch: two forks can both
## open a pull request from a branch called "main".
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

## https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  contents: read  # read the configuration files through the API
  pull-requests: write  # add labels and comments to pull requests
  issues: write   # create a label that does not exist yet

jobs:
  labeler:
    name: "PRs Labeler/Notifier Automatically"
    runs-on: ubuntu-latest

    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'

    steps:
      - name: 'Reviewer Checklist'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: github.event.action == 'opened'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thank you for your contribution to scikit-plots👋!

              ✍️ This checklist is meant to remind the package maintainers who will review this pull request of some common things to look for.

              ## Maintainer's Pull Request Review Checklist

              - [ ] Do the proposed changes actually accomplish desired goals?
              - [ ] Do the proposed changes follow the [scikit-plots coding guidelines](https://scikit-plots.github.io/dev/devel/index.html)?
              - [ ] Are tests added/updated as required? If so, do they follow the [scikit-plots testing guidelines](https://scikit-plots.github.io/dev/devel/index.html)?
              - [ ] Are docs added/updated as required? If so, do they follow the [scikit-plots documentation guidelines](https://scikit-plots.github.io/dev/devel/index.html)?
              - [ ] Is rebase and/or squash necessary? If so, please provide the author with appropriate instructions. Also see instructions for [rebase](https://scikit-plots.github.io/dev/devel/index.html) and [squash](https://scikit-plots.github.io/dev/devel/index.html).
              - [ ] Did the CI pass? If no, are the failures related? Codestyle issues can be fixed by the [bot](https://scikit-plots.github.io/dev/devel/index.html).
              - [ ] Is a change log needed? If yes, did the change log check pass? If no, add the "no-changelog-entry-needed" label. If this is a manual backport, use the "skip-changelog-checks" label unless special changelog handling is necessary.
              - [ ] Is this a big PR that makes a "What's new?" entry worthwhile and if so, is (1) a "what's new" entry included in this PR and (2) the "whats_new-needed" label applied?
              - [ ] At the time of adding the milestone, if the milestone set requires a backport to release branch(es), apply the appropriate "backport-X.Y.x" label(s) *before* merge.`
            })

      # Curated cross-cutting rules (CI, documentation, languages, tests, ...).
      - name: label based on changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        continue-on-error: true
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false
          dot: true
          configuration-path: ".github/labeler.yml"

      # Generated module and library rules.
      - name: label based on module changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        continue-on-error: true
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false
          dot: true
          configuration-path: ".github/labeler-by-module.yml"

      # Generated title rules: prefixes ("BUG:", "[Bug]:", "BUG, TST:") and
      # keywords. One prefix gives one label; "36 - Build" and "14 - Release"
      # are read by .github/workflows/ci_wheels_conda.yml.
      - name: label based on PR title
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-versioned-regex: 0
          include-body: 0
          include-title: 1
          configuration-path: ".github/labeler-issue.yml"

      - name: 'Comment Draft PR'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        # Once, when a draft is opened; not again on every push to it.
        if: github.event.action == 'opened' && github.event.pull_request.draft == true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 Thank you for your draft pull request!
              Do you know that you can use \`[ci skip]\` or \`[skip ci]\` in your commit messages to skip running continuous integration tests until you are ready?`
            })
