# Publish the `scikitplot` Claude plugin to scikit-plots/skills (Rule 166).
#
# One controller, in this repository; scikit-plots/skills holds no workflow of
# its own. Refs are mirrored by name:
#
#   push to main                ->  scikit-plots/skills main               (unversioned)
#   push to maintenance/X.Y.x   ->  scikit-plots/skills maintenance/X.Y.x  (unversioned)
#   push of tag vX.Y.Z[.postN]  ->  scikit-plots/skills tag vX.Y.Z[.postN] (version X.Y.Z[.postN])
#                                   and branch `stable` when that release is the newest
#
# An unversioned build sets no `version` in plugin.json, so Claude Code versions
# it by commit (https://code.claude.com/docs/en/plugins/marketplace-reference.md).
# A tag is immutable: when it already exists in scikit-plots/skills with another
# tree, the run fails instead of moving it.
#
# Security: `build` has `contents: read` and no secret; it runs the repository's
# own checks and build script and uploads the tree. `publish` runs no repository
# code: it downloads that tree as data and pushes it with a GitHub App
# installation token minted for scikit-plots/skills only, with `contents: write`
# only, inside the protected environment `claude-plugins` (add required
# reviewers there to gate releases). Setup: maintenances/_plugins/MAINTAINING.md.
#
# workflow_dispatch builds any ref as a dry run; set `publish` to push it too.
---
name: "CD 🧩 Claude plugins to scikit-plots/skills"
on:
  push:
    branches:
      - main
      - "maintenance/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also push the build to scikit-plots/skills (otherwise a dry run)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: claude-plugins-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_REPO: scikit-plots/skills

jobs:
  canonical:
    name: "Generated text is the same on Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: "🧪 Renderer golden test (no package build needed)"
        run: |
          python -m pip install "tomli>=1.1; python_version < '3.11'"
          python -I -B tools/maint_tools/tests/test_generate_usage_skills.py

  build:
    needs: canonical
    name: "Build the plugin tree"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # contents: read
      contents: write

    outputs:
      kind: ${{ steps.ref.outputs.kind }}
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
      base: ${{ steps.ref.outputs.base }}

    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: "📦 Install dependencies"
        run: |
          set -Eeuo pipefail
          # python -m pip install --upgrade --user --progress-bar=off --pre pip
          python -m pip install --upgrade pip

          pip install -r ./requirements/build.txt

      - name: "🔨 Build library"
        run: |
          set -Eeuo pipefail
          # pip install --no-build-isolation --no-cache-dir -e ".[dev,build,test,doc,cpu]" -v
          # The usage-skills extra is the generator's declared import set (Rule 168).
          python -m pip install --no-build-isolation --no-cache-dir -e ".[usage-skills]" -v

          # Verify whether installed Python packages have compatible dependencies.
          pip check || true

      - name: "🧭 Resolve channel"
        id: ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release='^v([0-9]+)\.([0-9]+)\.[0-9]+(\.post[0-9]+)?$'
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ $release ]]; then
              echo "::error::tag $REF_NAME is not vX.Y.Z or vX.Y.Z.postN; nothing is built."
              exit 1
            fi
            line="maintenance/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x"
            # A release tag must be on main or on its maintenance branch.
            on=""
            for branch in main "$line"; do
              if git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null \
                && git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
                on="$branch"
                break
              fi
            done
            if [ -z "$on" ]; then
              echo "::error::$REF_NAME is on neither main nor $line; refusing to publish it."
              exit 1
            fi
            {
              echo "kind=tag"
              echo "ref=$REF_NAME"
              echo "version=${REF_NAME#v}"
              echo "base=$line"
            } >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ] || [[ "$REF_NAME" == maintenance/* ]]; then
            { echo "kind=branch"; echo "ref=$REF_NAME"; echo "version="; echo "base=$REF_NAME"; } >> "$GITHUB_OUTPUT"
          else
            # A dispatch on another branch: build it as main would be, never publish it.
            { echo "kind=preview"; echo "ref=$REF_NAME"; echo "version="; echo "base="; } >> "$GITHUB_OUTPUT"
          fi

      - name: "🔎 Records, skills and plugins are current"
        # Check only, never regenerate: the published tree is the committed
        # one, byte for byte, so scikit-plots/skills always equals this ref
        # (Rule 168). The generator's text does not depend on the Python
        # version (the canonical job below proves it), so a sync on any
        # supported Python gives these bytes.
        run: |
          python -I -B maintenances/_repo/_maintenance/tools/check_records.py || {
            echo "::error::Records, agents or indexes are stale: run 'python -B maintenances/_repo/_maintenance/tools/check_records.py --write-index' and commit."
            exit 1
          }
          python -I -B tools/maint_tools/generate_usage_skills.py check || {
            echo "::error::Usage skills are stale: run 'python tools/maint_tools/generate_usage_skills.py sync' and commit."
            exit 1
          }

      - name: "🧩 Build"
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION" ]; then
            python -I -B tools/maint_tools/build_skills_repo.py build --out "$RUNNER_TEMP/tree" --version "$VERSION"
          else
            python -I -B tools/maint_tools/build_skills_repo.py build --out "$RUNNER_TEMP/tree" --unversioned
          fi

      - name: "📦 Upload the tree"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-plugin-tree
          path: ${{ runner.temp }}/tree
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: "Push to scikit-plots/skills"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    # Condition: Only run on the main repository, exclude previews,
    # and execute on push events or manual workflow_dispatch triggers with input.
    # Reference: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/expressions
    if: >-
      github.repository == 'scikit-plots/scikit-plots'
      && needs.build.outputs.kind != 'preview'
      && (github.event_name == 'push' || inputs.publish)

    # Links job context to the GitHub Environment (required to read environment variables/secrets)
    # Reference: https://docs.github.com/en/actions/deployment/targeting-deployment-environments/using-environments-for-deployment
    environment: claude-plugins

    # Restricts default GITHUB_TOKEN permissions to zero, since a custom App token is used instead.
    permissions: {}

    steps:
      # STEP 1: Generate a fine-grained installation token via a GitHub App
      # This token grants scoped access only to the target repository (scikit-plots/skills).
      # Reference: https://github.com/actions/create-github-app-token
      - name: "🔑 Token for scikit-plots/skills only"
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CLAUDE_PLUGINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_PLUGINS_APP_PRIVATE_KEY }}
          owner: scikit-plots
          repositories: skills
          permission-contents: write

      # STEP 2: Download the built plugin files artifact generated by the preceding 'build' job
      # Reference: https://github.com/actions/download-artifact
      - name: "📥 Download the tree"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claude-plugin-tree
          path: ${{ runner.temp }}/tree

      # STEP 3: Initialize a local git workspace, sync artifacts, commit, and push to target repository
      - name: "🚀 Commit and push the same-named ref"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          KIND: ${{ needs.build.outputs.kind }}
          REF: ${{ needs.build.outputs.ref }}
          BASE: ${{ needs.build.outputs.base }}
          SOURCE_SHA: ${{ github.sha }}
          TREE: ${{ runner.temp }}/tree
        run: |
          set -euo pipefail

          # Configure git HTTP header authentication with the generated App token
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git_() { git -c http.extraheader="AUTHORIZATION: basic $auth" "$@"; }

          # Initialize a temporary git directory for the target repository
          git init --quiet skills
          cd skills
          git remote add origin "https://github.com/${TARGET_REPO}.git"
          git_ fetch --quiet --tags origin "+refs/heads/*:refs/remotes/origin/*"

          # Determine starting branch: matching base branch, main branch, or orphan fallback
          # Start from the matching branch, else main, else an empty history.
          if git rev-parse --verify --quiet "refs/remotes/origin/$BASE" >/dev/null; then
            git checkout --quiet --detach "refs/remotes/origin/$BASE"
          elif git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            git checkout --quiet --detach refs/remotes/origin/main
          else
            git checkout --quiet --orphan start
          fi

          # Synchronize managed folders/files from the downloaded artifact tree
          # The published tree is exactly the built one (CI-8): everything but
          # .git is replaced, so no file the build did not make (a repository
          # template's .gitignore, an old LICENSE.txt, a workflow) survives.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a -- "$TREE"/. .
          git add -A

          # Check for branch-specific handling and no-op status
          if [ "$KIND" = "branch" ] && git diff --cached --quiet; then
            if git rev-parse --verify --quiet "refs/remotes/origin/$REF" >/dev/null; then
              echo "scikit-plots/skills $REF is already current."
              exit 0
            fi
            # A new branch with its base's tree: create it at the base, no commit.
            git_ push --quiet origin "HEAD:refs/heads/$REF"
            echo "scikit-plots/skills $REF created at its base."
            exit 0
          fi

          # Commit synced files using a designated bot identity
          git -c user.name="scikit-plots-bot" \
            -c user.email="scikit-plots-maintainers@googlegroups.com" \
            commit --quiet --allow-empty \
            -m "Build ${REF} from scikit-plots/scikit-plots@${SOURCE_SHA}"
          if [ "$KIND" = "branch" ]; then
            git_ push --quiet origin "HEAD:refs/heads/$REF"
          else

            # Handle tag validation and creation
            if git rev-parse --verify --quiet "refs/tags/$REF" >/dev/null; then
              if [ "$(git rev-parse "refs/tags/$REF^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]; then
                echo "::error::scikit-plots/skills $REF exists with another tree; tags are never moved."
                exit 1
              fi
              echo "scikit-plots/skills $REF already exists with this tree."
              git checkout --quiet --detach "refs/tags/$REF"
            else
              git tag "$REF" HEAD
              git_ push --quiet origin "refs/tags/$REF"
            fi

            # `stable` is the newest release by version, never an older one, so
            # it can be the default branch the directory and a plain
            # `marketplace add scikit-plots/skills` read (main is development).
            # Maintain the `stable` branch pointer pointing to the highest version release
            version="${REF#v}"
            current=""
            if git rev-parse --verify --quiet refs/remotes/origin/stable >/dev/null; then
              current="$(git show refs/remotes/origin/stable:.claude-plugin/plugin.json \
                | python3 -I -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))')"
            fi
            newest="$(printf '%s\n%s\n' "$current" "$version" | sed '/^$/d' | sort -V | tail -n 1)"
            if [ "$current" != "$version" ] && [ "$newest" = "$version" ]; then
              git_ push --quiet --force origin "HEAD:refs/heads/stable"
              echo "stable: ${current:-none} -> $version"
            else
              echo "stable stays at ${current}: $version is not newer."
            fi
          fi
          # Log successful sync summary to GitHub Actions job summary
          echo "### scikit-plots/skills ${REF} <- scikit-plots/scikit-plots@${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
