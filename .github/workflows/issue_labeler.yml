# Issue Labeler
#
# Labels issues from their titles with the generated rules in
# .github/labeler-issue.yml ("BUG: ...", "[Bug]: ...", keywords). The same rules
# label pull-request titles in .github/workflows/pr_labeler.yml.
#
# No checkout: github/issue-labeler reads the configuration through the API.
# Regenerate and check the rules with:
#   python tools/maint_tools/generate_pr_labeler.py sync --apply
#   python tools/maint_tools/generate_pr_labeler.py check
---
name: "Issue 🤖 Labeler"

on:
  issues:
    ## edited: a changed title is labelled again.
    types: [opened, edited]

## One run per issue at a time; a newer edit cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

## https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  contents: read  # read the configuration file through the API
  issues: write   # add labels to issues

jobs:
  labeler:
    name: "Issue Labeler Automatically"
    runs-on: ubuntu-latest

    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'

    steps:
      - name: label based on issue title
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-versioned-regex: 0
          include-body: 0
          include-title: 1
          configuration-path: ".github/labeler-issue.yml"
