# The labeler configurations must stay in sync with the code they describe.
#
# .github/labeler-by-module.yml and .github/labeler-issue.yml are generated by
# tools/maint_tools/generate_pr_labeler.py from the towncrier owner sections,
# scikitplot/_distributions.py and pyproject.toml
# [tool.scikitplot.maintenance.labeler]; .github/labeler.yml is curated by hand.
# `check` fails on a stale generated file, a glob outside the supported subset,
# a negated glob that would label every pull request, a label longer than
# GitHub allows, or a label referenced by an issue template or workflow that no
# rule defines. Unmatched curated globs are reported as warnings.
---
name: "PRs 🏷️ Labeler Config"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler-config:
    name: "Check labeler configuration"
    runs-on: ubuntu-latest
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: "📦 Install PyYAML"
        run: python -m pip install "pyyaml>=6.0"

      - name: "🗂️ Towncrier owner sections are in sync"
        run: python tools/maint_tools/generate_towncrier_sections.py check

      - name: "🏷️ Labeler configurations are in sync and valid"
        run: python tools/maint_tools/generate_pr_labeler.py check

      - name: "🧪 Tool tests"
        run: python -m unittest tools/maint_tools/tests/test_generate_pr_labeler.py -v
