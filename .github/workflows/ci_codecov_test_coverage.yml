# https://app.codecov.io/gh/scikit-plots/scikit-plots/new
---
name: "CI ☂️ Codecov Test Coverage"

on:
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      mode:
        description: "auto: only what the changed files affect · all: everything · custom: the submodules named below"
        type: choice
        options: [auto, all, custom]
        default: auto
      submodules:
        description: "custom mode: submodule names, e.g. 'corpus _sphinx_ai_learn' or 'scikitplot/cleanprompt'"
        type: string
        default: ""
      max_shards:
        description: "Most parallel test jobs (empty: the value in .github/ci/test_plan.json)"
        type: string
        default: ""
      test_gc:
        description: "Garbage collection between tests (see scikitplot/conftest.py)"
        type: choice
        options: [young, frozen, module, test, off]
        default: young
      max_failures:
        description: "Failures after which a test job stops (0: never; empty: 50)"
        type: string
        default: ""
      profile_tests:
        description: "Profile these tests one by one (a regular expression of node ids; empty: none). See .github/ci/README.md, section 12"
        type: string
        default: ""
  push:
    # branches: [ "main", "*.X" ]
    branches:
      - main
      ## Release branches
      - maintenance/**
  pull_request:
    # branches: [ "main", "*.X" ]
    branches:
      - main
      ## Release branches
      - maintenance/**
  schedule:
    ## Automatically built and released every night (or at a regular interval, often nightly)
    ## Cron schedule for automated runs
    ## https://crontab.cronhub.io
    ## https://freeformatter.com/cron-expression-generator-quartz.html#cronexpressionexamples
    ## https://crontab.io/validator
    ## https://cron-checker.com/
    ## "* * * * * * *" 7 fields (Quartz with year)         <second> <minute> <hour> <day of month> <month> <day of week> <year>
    ## "* * * * * *"   6 fields (Quartz / some schedulers) <second> <minute> <hour> <day of month> <month> <day of week>
    ## "* * * * *"     5 fields (standard Unix cron)       <minute> <hour> <day of month> <month> <day of week>
    ##        ┌─────────────────────── minute           (0 - 59)
    ##        │  ┌──────────────────── hour             (0 - 23)
    ##        │  │  ┌───────────────── day of the month (1 - 31)
    ##        │  │  │ ┌─────────────── month            (1 - 12 or JAN-DEC)
    ##        │  │  │ │ ┌───────────── day of the week  (0 - 7 or SUN-SAT)
    ##        │  │  │ │ │
    ## cron: "11 11 * * SUN,WED"  # Runs every Sunday and Wednesday at 11:11 UTC
    - cron: '11 11 * * 1'

## simultaneity
## This ensures that only one deployment to "production" can happen at a time.
## If a new commit is pushed before the current job finishes, the in-progress job is canceled.
concurrency:
  ## Ensures that only one instance of this workflow runs per branch or PR at a time.
  ## The 'group' key defines a unique concurrency group:
  ## - github.workflow: Name of the workflow file.
  ## - github.head_ref: (Only on pull_request) The name of the branch from which the PR was created (source branch). Example: "feature/add-login"
  ## - github.run_id: (Always) A unique numeric ID for each run of a workflow. Useful as a fallback for uniqueness. Example: 6432789156
  ## - github.ref: (Always) The full ref path of the branch or tag that triggered the workflow. Examples: For a push to a branch: "refs/heads/main" For a PR: "refs/pull/42/merge" For a tag: "refs/tags/v1.0.0"
  ## - github.ref_name: (Always) Just the final part of the ref path (branch or tag name, does not exist for PRs). Examples: For a push to a branch: "main" For a tag: "v1.0.0"
  ## This ensures: PRs use head_ref, Pushes/Tags use ref or ref_name, Fallback to run_id in edge cases
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  ## If you push multiple times quickly, older runs would continue even though newer ones have started.
  ## Canceling previous runs reduces resource usage and speeds up feedback.
  ## If a new run is triggered for the same group, cancel the in-progress one.
  cancel-in-progress: true  # ${{ github.event_name == 'pull_request' }}

## Top-level permissions (outside jobs)
## Job-level permissions (inside a specific job)
## Restrict the permissions granted to the use of secrets.GITHUB_TOKEN in this
## github actions workflow:
## https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  ## only required for workflows in private repositories
  contents: read  # for actions/checkout to fetch code

jobs:
  ## ------------------------------------------------------------------
  ## 1. Decide what runs.
  ##
  ## .github/scripts/ci_test_plan.py turns the changed files (or a manual
  ## choice) into a list of test jobs. Its rules, and how to change them,
  ## are in .github/ci/README.md. Nothing is installed here: the planner
  ## uses the standard library only.
  ## ------------------------------------------------------------------
  plan:
    name: "🧭 Plan tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'

    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: "⬇️ Checkout (cloned) repository with full history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Prevents accidental credential exposure
          fetch-depth: 0    # The planner compares commits
          ## Gets the correct commit for a pull request
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: "🧪 Check the planner itself"
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"

      - name: "🧭 Plan"
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SUBMODULES: ${{ inputs.submodules }}
          INPUT_MAX_SHARDS: ${{ inputs.max_shards }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          # A manual run uses the chosen mode; every other event uses the
          # mode configured for it in .github/ci/test_plan.json.
          mode="default"
          base=""
          head="$HEAD_SHA"
          case "$EVENT_NAME" in
            workflow_dispatch)
              mode="${INPUT_MODE:-auto}"
              base="origin/${DEFAULT_BRANCH}"
              ;;
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              ;;
          esac
          python3 .github/scripts/ci_test_plan.py plan \
            --mode "$mode" \
            --event "$EVENT_NAME" \
            --base "$base" \
            --head "$head" \
            --select "$INPUT_SUBMODULES" \
            --max-shards "$INPUT_MAX_SHARDS" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  ## ------------------------------------------------------------------
  ## 2. Run the tests, one job per shard.
  ##
  ## Each job has the full six hours of a GitHub-hosted runner to itself
  ## and writes its own coverage data file; job 3 combines them.
  ## ------------------------------------------------------------------
  test:
    name: "☂️ Test ${{ matrix.name }} (~${{ matrix.estimate_minutes }} min)"
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest

    ## For GitHub-hosted runners, the hard cap is 360 minutes (6 hours).
    ## The planner keeps each job under it by splitting; raise
    ## "shard_timeout_minutes" or "max_shards" in .github/ci/test_plan.json.
    timeout-minutes: ${{ matrix.timeout_minutes }}

    strategy:
      fail-fast: false   # One failing shard must not hide the others' results
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      SETUPTOOLS_USE_DISTUTILS: local
      # Where the libraries keep downloaded models (the Hugging Face Hub
      # cache). The models are fetched before the tests, and the tests run
      # with the network switched off for them (see the test step).
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: "⬇️ Checkout (cloned) repository with full history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Prevents accidental credential exposure
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
          lfs: true
          ## Gets the correct commit message for pull request
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          # Every shard installs the same large stack; keep pip's download
          # cache between runs. pip still asks the index for the newest
          # versions the requirements allow: the cache only saves downloads.
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml

      - name: "📦 Install dependencies"
        run: |
          set -Eeuo pipefail
          # python -m pip install --upgrade --user --progress-bar=off --pre pip
          python -m pip install --upgrade pip

          # pip install -r ./requirements/build.txt
          # pip install -r ./requirements/dev.txt
          # pip install -r ./requirements/doc.txt
          # pip install -r ./requirements/test.txt
          pip install -r requirements/all.txt

          pip install -r ./requirements/cleanprompt.txt
          # tf need for documentation examples
          pip install -r ./requirements/cpu.txt
          pip install -r ./requirements/corpus.txt
          pip install -r ./requirements/mcp.txt
          pip install -r ./requirements/mlflow.txt

          # sudo apt-get install tesseract-ocr
          # pip install pytesseract

          pip install coverage
          pip install polars pyarrow
          pip install httpx gradio streamlit flask fastapi
          pip install nltk spacy

          # The same two scripts serve Docker images, the devcontainer and
          # the documentation build; see their headers for the options.
          bash docker/scripts/install_nltk.sh
          bash docker/scripts/install_spacy.sh

          # Verify whether installed Python packages have compatible dependencies.
          pip check || true

      # The models the tests load, fetched once and kept between runs, so no
      # test downloads one: a test that did took 110 s here, and in a run
      # without network it fell back silently. The key covers the script and
      # its default model list; a model is a few hundred MB to 1.1 GB.
      - name: "📦 Restore the models the tests load"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HOME }}
          key: models-${{ runner.os }}-${{ hashFiles('docker/scripts/install_models.py', 'docker/scripts/install_sentence_transformers.sh') }}

      - name: "📦 Fetch the models the tests load, and prove they load offline"
        run: |
          set -Eeuo pipefail
          # Only the models a test asks for: a run with HF_HUB_OFFLINE=1 and a
          # recorder of refused fetches over corpus, datasets, cleanprompt,
          # _lib, tests and utils found one, this default. Add a model here
          # (or SENTENCE_TRANSFORMERS_MODELS) when a test needs another; the
          # script fails with the library's error if it does not load.
          bash docker/scripts/install_sentence_transformers.sh

      - name: "🔨 Build library"
        run: |
          set -Eeuo pipefail
          # Resolve distutils conflict before any setuptools-dependent install
          # export SETUPTOOLS_USE_DISTUTILS=local
          # pip install "setuptools>=69"
          # ✅ It’s a distutils override conflict, pythran cause setuptools<60
          pip install -U setuptools

          # pip install --no-build-isolation --no-cache-dir -e ".[dev,build,test,doc,cpu]" -v
          python -m pip install --no-build-isolation --no-cache-dir -e . -v

          # Verify whether installed Python packages have compatible dependencies.
          pip check || true

      - name: "☂️ Run tests with coverage"
        env:
          SHARD_NAME: ${{ matrix.name }}
          SHARD_PATHS: ${{ matrix.paths }}
          # One data file per shard; the report job combines them.
          COVERAGE_FILE: .coverage.${{ matrix.name }}
          SKPLT_TEST_GC: ${{ inputs.test_gc || 'young' }}
          # pytest.ini stops at the first failure, which suits a single
          # local run. Each job here covers only part of the suite, so one
          # run should report every failure it has; the last --maxfail on
          # the command line is the one pytest uses.
          MAX_FAILURES: ${{ inputs.max_failures || '50' }}
          # Fail the run if every test costs more than this many seconds
          # before it does any work: the sign of an expensive per-test hook
          # or autouse fixture, which once made this job need six hours.
          # Measured today: 0.003. See scikitplot/conftest.py.
          SKPLT_TEST_FLOOR_BUDGET: "0.1"
          # Record where every test spends time and memory: one JSON line per
          # test, written as it finishes, so a shard stopped at its time limit
          # keeps every test that finished. The report job analyses all
          # shards together (.github/ci/README.md, section 12).
          SKPLT_TEST_PERF_DIR: reports/perf
          SKPLT_TEST_PERF_LABEL: ${{ matrix.name }}
          SKPLT_TEST_PERF_PROFILE: ${{ inputs.profile_tests }}
          # Models come from the cache filled above; nothing is downloaded
          # while tests run, and a model missing from it fails to load with
          # the library's own "not in the cache" error instead of a slow or
          # silent download (the header line "model cache" names what is there).
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Test trees that load TensorFlow into the test process. They run in
          # a second pytest session (below): with TensorFlow loaded first, a
          # later import of triton (torch._dynamo, transformers,
          # sentence-transformers) ends the process with SIGSEGV and no Python
          # error, which lost every result after 62 percent of run 40244733381.
          # In the main session these trees skip themselves (their conftest).
          TENSORFLOW_SUITES: scikitplot/visualkeras
          # No repository secret is given to this step, on purpose. A pull
          # request from a fork has none, so a secret here makes a push test
          # something a pull request did not (HF_TOKEN once turned a passing
          # test into a failing one on main), and it hands a live credential
          # to every test and every installed package. A test that needs a
          # token sets a made-up one itself.
        run: |
          set -Eeuo pipefail
          if ! [[ "$MAX_FAILURES" =~ ^[0-9]+$ ]]; then
            echo "::error::max_failures must be a whole number, got '$MAX_FAILURES'"
            exit 2
          fi
          rm -f coverage.xml .coverage .coverage.*
          mkdir -p reports
          read -r -a paths <<<"$SHARD_PATHS"
          read -r -a tf_suites <<<"$TENSORFLOW_SUITES"
          # The TensorFlow suites inside this shard: a suite equal to or
          # below a shard path, or a shard path below a suite.
          tf_paths=()
          for p in "${paths[@]}"; do
            for s in "${tf_suites[@]}"; do
              if [[ "$s" == "$p" || "$s" == "$p"/* ]]; then tf_paths+=("$s")
              elif [[ "$p" == "$s"/* ]]; then tf_paths+=("$p")
              fi
            done
          done
          # Exit status 5 is "no tests collected": a submodule without tests
          # is not a failure of the run.
          run_session() {
            local label="$1"; shift
            local code=0
            "$@" || code=$?
            if [ "$code" -eq 5 ]; then
              echo "::notice::no tests were collected in the $label session"
              code=0
            fi
            return "$code"
          }
          status=0
          run_session main pytest "${paths[@]}" \
            --maxfail="$MAX_FAILURES" \
            --cov \
            --cov-branch \
            --cov-report= \
            --junitxml="reports/junit-${SHARD_NAME}.xml" || status=$?
          # 139 is SIGSEGV (128 + 11): a native crash, not a test failure.
          # The Python stack of the crash is printed above, just before it.
          if [ "$status" -ge 128 ]; then
            echo "::error::the test process ended by signal $((status - 128)) (exit $status); its Python stack is printed above the crash"
          fi
          if [ "${#tf_paths[@]}" -gt 0 ]; then
            tf_status=0
            SKPLT_TEST_TENSORFLOW=1 SKPLT_TEST_PERF_LABEL="${SHARD_NAME}-tensorflow" \
              run_session TensorFlow pytest "${tf_paths[@]}" \
              --maxfail="$MAX_FAILURES" \
              --cov \
              --cov-append \
              --cov-branch \
              --cov-report= \
              --junitxml="reports/junit-${SHARD_NAME}-tensorflow.xml" || tf_status=$?
            if [ "$status" -eq 0 ]; then status="$tf_status"; fi
          fi
          exit "$status"

      - name: "⬆️ Keep coverage data, the test report and the performance record"
        # Also when tests failed, or the job was stopped at its time limit:
        # the JUnit report and the performance record are the evidence of
        # what happened, and without them the duration estimates of exactly
        # the failing shards were never refreshed. The report job uploads
        # coverage to Codecov only from a run whose every shard succeeded.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.name }}
          path: |
            .coverage.*
            reports/junit-*.xml
            reports/perf/
          include-hidden-files: true   # .coverage.* is a hidden file
          if-no-files-found: warn
          retention-days: 7

  ## ------------------------------------------------------------------
  ## 3. Combine, report, and decide the result of the whole run.
  ##
  ## This job keeps the name the single job had, so a branch protection
  ## rule that requires it keeps working. It also runs when nothing needed
  ## testing, and then succeeds.
  ## ------------------------------------------------------------------
  report:
    name: "CI Test and Coverage Codecov Reports"
    needs: [plan, test]
    # always(): this job is the check that branch protection requires, so it
    # must run whatever its needs did and decide in its last step. Under
    # success() a failed shard made it *skipped*, and GitHub reports a job
    # skipped by its condition as passing, so a red run counted as green.
    if: always() && github.repository == 'scikit-plots/scikit-plots'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      PLAN_RUN: ${{ needs.plan.outputs.run }}
      PLAN_MODE: ${{ needs.plan.outputs.mode }}
      TEST_RESULT: ${{ needs.test.result }}

    steps:
      - name: "🚦 Nothing to test"
        if: needs.plan.result == 'success' && needs.plan.outputs.run != 'true'
        run: echo "No file of the library changed; no test job was needed." >> "$GITHUB_STEP_SUMMARY"

      - name: "⬇️ Checkout (cloned) repository"
        if: needs.plan.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Prevents accidental credential exposure
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        if: needs.plan.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: "⬇️ Collect every shard's coverage data"
        if: needs.plan.outputs.run == 'true'
        # A shard that failed before its upload leaves nothing to collect;
        # that is reported by the last step, so only a run whose shards all
        # succeeded may fail here.
        continue-on-error: ${{ needs.test.result != 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: "🧮 Combine coverage"
        if: needs.plan.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install coverage
          rm -f coverage.xml .coverage
          shopt -s nullglob
          files=(coverage-data/.coverage.*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no coverage data was produced by the test jobs"
            exit 0
          fi
          coverage combine "${files[@]}"
          # A selection without tests leaves data files with nothing in them;
          # there is then no report to write, and that is not an error.
          if ! coverage report -i --format=total >/dev/null 2>&1; then
            echo "::notice::the test jobs recorded no coverage (no tests ran)"
            echo "No coverage was recorded: the selected submodules collected no tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -i: a file that exists only in a built tree (generated sources)
          # has no source here; it is left out instead of failing the report.
          coverage xml -i -o coverage.xml
          {
            echo "## Coverage"
            echo
            echo "- Mode: **${PLAN_MODE}**, from ${#files[@]} test job(s)"
            echo "- Line and branch coverage of what ran: **$(coverage report -i --format=total)%**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "⏱️ Refresh the duration estimates"
        if: needs.plan.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          reports=(coverage-data/reports/junit-*.xml)
          if [ "${#reports[@]}" -gt 0 ]; then
            python3 .github/scripts/ci_test_durations.py "${reports[@]}" \
              --source "workflow run ${GITHUB_RUN_ID} (${PLAN_MODE})" \
              --output test_durations.json
          fi

      - name: "⬆️ Keep the combined report"
        if: needs.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            test_durations.json
          if-no-files-found: warn
          retention-days: 14

      - name: "⏱️ Analyse test performance"
        # Every shard's performance record and JUnit report become one
        # report: per unit, test file, test and fixture, with findings and
        # their evidence (.github/ci/README.md, section 12). The tests decide
        # the result of the run, not this analysis, so a failure here does
        # not fail the run; the analyzer's own tests run in the plan job.
        if: needs.plan.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          inputs=()
          [ -d coverage-data/reports ] && inputs+=(coverage-data/reports)
          [ -f coverage.xml ] && inputs+=(coverage.xml)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::notice::no test evidence to analyse"
            exit 0
          fi
          python3 .github/scripts/ci_test_perf.py report \
            "${inputs[@]}" .github/ci/test_durations.json \
            --out test-perf \
            --bundle \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: "⬆️ Keep the performance report"
        if: needs.plan.outputs.run == 'true' && hashFiles('test-perf/summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-perf
          path: test-perf/
          if-no-files-found: warn
          retention-days: 30

      ## Codecov reads a report as the coverage of the whole project. A run
      ## that tested only some submodules would look like a collapse, so only
      ## a complete and successful run is uploaded.
      - name: "☂️ Upload coverage reports to Codecov"
        if: needs.plan.outputs.mode == 'all' && needs.test.result == 'success' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          fail_ci_if_error: false # optional (default = false)
          files: ./coverage.xml # optional
          disable_search: true    # Only the combined report
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)

      - name: "🚦 Result of the run"
        run: |
          set -Eeuo pipefail
          echo "plan=${PLAN_RESULT} run=${PLAN_RUN} mode=${PLAN_MODE} test=${TEST_RESULT}"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the test plan could not be made"
            exit 1
          fi
          if [ "$PLAN_RUN" != "true" ]; then
            exit 0
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::at least one test job did not succeed (${TEST_RESULT})"
            exit 1
          fi
