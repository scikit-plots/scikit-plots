# No requirement list may name a distribution this project must not require.
#
# Two distributions that ship the same import package overwrite each other
# when both are installed. The corpus extra once required "pdfminer" next to
# "pdfminer.six"; installed together they left a package that could not
# import pdfminer.high_level, and scikitplot.corpus.PDFReader stopped using
# pdfminer without an error.
# tools/maint_tools/check_refused_requirements.py reads every requirement
# list (pyproject.toml, libs/*/pyproject.toml, requirements/*.txt) in a
# second with nothing installed, and says what to require instead and why.
---
name: "PRs 📦 Refused Requirements"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refused-requirements:
    name: "Check refused requirements"
    runs-on: ubuntu-latest
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: "🔎 No requirement list names a refused distribution"
        run: python tools/maint_tools/check_refused_requirements.py

      - name: "🧪 Tool tests"
        run: python -m unittest tools/maint_tools/tests/test_check_refused_requirements.py -v
