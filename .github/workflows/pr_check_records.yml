# Work records stay in their planes (increment 4R, Rule 124).
#
# tasks/ holds only a router; plans, results and history live with the plane
# that owns them (maintenances/<sub>/, docs/tasks/), and the numbered rules in
# skills/_engineering/. A drop-in archive cannot delete files, so a stale
# tasks/todo.md or tasks/lessons.md would survive an update (Rule 67); this
# check fails while one is present, and also checks rule numbering, the rule
# index, the archived history and the links between the records.
---
name: "PRs 🗂️ Work Records"
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches:
  #     - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  work-records:
    name: "Check work records"
    runs-on: ubuntu-latest
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: "🔎 Records are where the router says"
        run: python -B maintenances/_repo/_maintenance/tools/check_records.py

      - name: "🧪 Checker tests"
        run: |
          python -m pip install pytest
          python -B maintenances/_repo/_maintenance/tests/test_records.py
