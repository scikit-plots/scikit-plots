# Records and Claude plugins stay in their two homes (Rules 124, 167).
#
# maintenances/ holds every record (maintenances/README.md is the map) and
# plugins/ everything that ships to Claude. The check fails while a retired
# location (tasks/, docs/tasks/, docs/maintenances/, docs/skills/, root skills/
# and agents/, plugins/maintenances/) holds a file - a drop-in archive cannot
# delete files (Rule 67) - and also checks rule numbering, the rule index, the
# archived history, the links between the records, the skills (Agent Skills
# names, one folder each, package mirror, shared copies; Rule 164) and the
# marketplace against the plugins.
---
name: "PRs 🗂️ Work Records"
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches:
  #     - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  work-records:
    name: "Check work records"
    runs-on: ubuntu-latest
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: "🔎 Records are where the router says"
        run: python -B maintenances/_repo/_maintenance/tools/check_records.py

      - name: "🧪 Checker tests"
        run: |
          python -m pip install pytest
          python -B maintenances/_repo/_maintenance/tests/test_records.py
