# On demand only: where tests spend their time, and how fast the package is.
#
# Everyday measurement is local and needs no workflow (`make test-perf`,
# `make bench`; .github/ci/README.md, section 12, and benchmarks/README.md).
# This workflow is the check on a clean runner: for one submodule or a few,
# before a merge or a release, without the coverage run.
---
name: "CI ⏱️ Performance (on demand)"

on:
  workflow_dispatch:
    inputs:
      test_paths:
        description: "Test paths to record, space separated (e.g. 'scikitplot/annoy scikitplot/api'); empty: no test job"
        type: string
        default: "scikitplot"
      profile_tests:
        description: "Profile these tests one by one (a regular expression of node ids; empty: none)"
        type: string
        default: ""
      test_gc:
        description: "Garbage collection between tests (see scikitplot/conftest.py)"
        type: choice
        options: [young, frozen, module, test, off]
        default: young
      requirements:
        description: "Requirement files for the test job, space separated (under requirements/)"
        type: string
        default: "requirements/all.txt requirements/cpu.txt"
      benchmarks:
        description: "Run the package benchmarks (benchmarks/), base against this branch"
        type: boolean
        default: false
      bench:
        description: "Only benchmarks matching this regular expression (empty: all)"
        type: string
        default: ""
      base:
        description: "Benchmarks: compare against where this branch left the default branch (merge-base), or the default branch's tip"
        type: choice
        options: [merge-base, default-branch]
        default: merge-base
      quick:
        description: "Benchmarks: one sample each, a smoke test rather than a measurement"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ## ------------------------------------------------------------------
  ## Where the selected tests spend time and memory (no coverage).
  ## ------------------------------------------------------------------
  tests:
    name: "⏱️ Record tests"
    if: inputs.test_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SETUPTOOLS_USE_DISTUTILS: local
      # The Hugging Face Hub cache: models are fetched before the tests,
      # which then run offline (as in ci_codecov_test_coverage.yml).
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml

      - name: "📦 Install dependencies"
        run: |
          set -Eeuo pipefail
          # python -m pip install --upgrade --user --progress-bar=off --pre pip
          python -m pip install --upgrade pip

          # pip install -r ./requirements/build.txt
          # pip install -r ./requirements/dev.txt
          # pip install -r ./requirements/doc.txt
          # pip install -r ./requirements/test.txt
          pip install -r requirements/all.txt

          pip install -r ./requirements/cleanprompt.txt
          # tf need for documentation examples
          pip install -r ./requirements/cpu.txt
          pip install -r ./requirements/corpus.txt
          pip install -r ./requirements/mcp.txt
          pip install -r ./requirements/mlflow.txt

          # sudo apt-get install tesseract-ocr
          # pip install pytesseract

          pip install coverage
          pip install polars pyarrow
          pip install httpx gradio streamlit flask fastapi
          pip install nltk spacy

          # The same two scripts serve Docker images, the devcontainer and
          # the documentation build; see their headers for the options.
          bash docker/scripts/install_nltk.sh
          bash docker/scripts/install_spacy.sh

          # Verify whether installed Python packages have compatible dependencies.
          pip check || true

      # The models the tests load, fetched once and kept between runs; see
      # the same steps in ci_codecov_test_coverage.yml. This job checks out
      # only the branch it was dispatched on (the benchmarks job below builds
      # a second revision and keeps no cache, Rule 155).
      - name: "📦 Restore the models the tests load"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HOME }}
          key: models-${{ runner.os }}-${{ hashFiles('docker/scripts/install_models.py', 'docker/scripts/install_sentence_transformers.sh') }}

      - name: "📦 Fetch the models the tests load, and prove they load offline"
        run: bash docker/scripts/install_sentence_transformers.sh

      - name: "🔨 Install the requirements and build the library"
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -Eeuo pipefail
          read -r -a files <<<"$REQUIREMENTS"
          args=()
          for f in "${files[@]}"; do
            # Only files of requirements/: an input never names another path.
            if ! [[ "$f" =~ ^requirements/[A-Za-z0-9_.-]+\.txt$ && -f "$f" ]]; then
              echo "::error::not a requirements file of this repository: '$f'"
              exit 2
            fi
            args+=(-r "$f")
          done
          python -m pip install --upgrade pip
          python -m pip install "${args[@]}"
          python -m pip install -U setuptools
          python -m pip install --no-build-isolation --no-cache-dir -e . -v

          # Verify whether installed Python packages have compatible dependencies.
          pip check || true

      - name: "⏱️ Run the tests with the recorder"
        env:
          TEST_PATHS: ${{ inputs.test_paths }}
          SKPLT_TEST_GC: ${{ inputs.test_gc }}
          SKPLT_TEST_PERF_DIR: reports/perf
          SKPLT_TEST_PERF_LABEL: on-demand
          SKPLT_TEST_PERF_PROFILE: ${{ inputs.profile_tests }}
          # Offline for models, and TensorFlow suites in a session of their
          # own: see the test step of ci_codecov_test_coverage.yml.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TENSORFLOW_SUITES: scikitplot/visualkeras
        run: |
          set -Eeuo pipefail
          read -r -a paths <<<"$TEST_PATHS"
          for p in "${paths[@]}"; do
            if ! [[ "$p" =~ ^scikitplot(/[A-Za-z0-9_.-]+)*$ && "$p" != *..* && -e "$p" ]]; then
              echo "::error::not a path of the package: '$p'"
              exit 2
            fi
          done
          read -r -a tf_suites <<<"$TENSORFLOW_SUITES"
          tf_paths=()
          for p in "${paths[@]}"; do
            for s in "${tf_suites[@]}"; do
              if [[ "$s" == "$p" || "$s" == "$p"/* ]]; then tf_paths+=("$s")
              elif [[ "$p" == "$s"/* ]]; then tf_paths+=("$p")
              fi
            done
          done
          run_session() {
            local label="$1"; shift
            local code=0
            "$@" || code=$?
            if [ "$code" -eq 5 ]; then
              echo "::notice::no tests were collected in the $label session"
              code=0
            fi
            return "$code"
          }
          options=(-vv --tb=long --full-trace --maxfail=0 -p no:cacheprovider)
          status=0
          run_session main python -m pytest "${paths[@]}" "${options[@]}" || status=$?
          if [ "$status" -ge 128 ]; then
            echo "::error::the test process ended by signal $((status - 128)) (exit $status); its Python stack is printed above the crash"
          fi
          if [ "${#tf_paths[@]}" -gt 0 ]; then
            tf_status=0
            SKPLT_TEST_TENSORFLOW=1 SKPLT_TEST_PERF_LABEL=on-demand-tensorflow \
              run_session TensorFlow python -m pytest "${tf_paths[@]}" "${options[@]}" \
              || tf_status=$?
            if [ "$status" -eq 0 ]; then status="$tf_status"; fi
          fi
          exit "$status"

      - name: "📊 Analyse"
        if: always() && hashFiles('reports/perf/**') != ''
        run: |
          python3 .github/scripts/ci_test_perf.py report reports/perf \
            .github/ci/test_durations.json --out test-perf --bundle \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: "⬆️ Keep the report"
        if: always() && hashFiles('test-perf/summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-perf-on-demand
          path: test-perf/
          if-no-files-found: error
          retention-days: 30

  ## ------------------------------------------------------------------
  ## The package benchmarks: base and this branch, each installed into a
  ## virtualenv of its own (not editable, so an import measures the
  ## installed package), run alternately on this one runner.
  ##
  ## The base is derived from the repository, never typed into the form
  ## (Rule 155): building a package runs its code, and a workflow_dispatch
  ## run can write the cache of the branch it runs on, the default branch
  ## included. A free-form ref could name code nobody merged (a fork's
  ## refs/pull/N/head), so CodeQL reported it as cache poisoning
  ## (actions/cache-poisoning/poisonable-step, alerts 231 and 232). The
  ## base is a commit of the default branch, and this job keeps no cache.
  ## ------------------------------------------------------------------
  benchmarks:
    name: "📈 Benchmarks: ${{ inputs.base }} vs this branch"
    if: inputs.benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: "⬇️ Checkout this branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
          path: head
          # The default branch's history, to find the base in it.
          fetch-depth: 0

      - name: "🔎 Check out the base: a commit of the default branch"
        id: base
        env:
          BASE: ${{ inputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          tip=$(git -C head rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")
          case "$BASE" in
            merge-base) sha=$(git -C head merge-base "$tip" HEAD) ;;
            default-branch) sha=$tip ;;
            *) echo "::error::unknown base: '$BASE'"; exit 2 ;;
          esac
          # Only merged code is built: the base must be on the default branch.
          if ! git -C head merge-base --is-ancestor "$sha" "$tip"; then
            echo "::error::$sha is not on $DEFAULT_BRANCH"
            exit 2
          fi
          git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$sha"
          git -C base lfs pull
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # No pip cache in this job: it builds two trees, and keeps nothing a
      # later run would restore.
      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: "🔨 Build and install both"
        run: |
          set -Eeuo pipefail
          for side in base head; do
            python -m venv "$RUNNER_TEMP/venv-$side"
            "$RUNNER_TEMP/venv-$side/bin/python" -m pip install --upgrade pip
            "$RUNNER_TEMP/venv-$side/bin/python" -m pip install "./$side"
          done

      - name: "📈 Run alternately and compare"
        env:
          BENCH: ${{ inputs.bench }}
          BASE: ${{ inputs.base }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          QUICK: ${{ inputs.quick }}
        run: |
          set -Eeuo pipefail
          args=(--dir head/benchmarks/benchmarks --out bench
                --base-python "$RUNNER_TEMP/venv-base/bin/python"
                --head-python "$RUNNER_TEMP/venv-head/bin/python"
                --base-label "$BASE@${BASE_SHA:0:12}" --head-label "$GITHUB_SHA")
          if [ -n "$BENCH" ]; then args+=("--bench=$BENCH"); fi
          if [ "$QUICK" = "true" ]; then args+=(--quick); fi
          python3 head/.github/scripts/ci_bench.py pair "${args[@]}"
          cat bench/compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: "⬆️ Keep the results"
        if: always() && hashFiles('bench/compare.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-on-demand
          path: bench/
          if-no-files-found: error
          retention-days: 30
