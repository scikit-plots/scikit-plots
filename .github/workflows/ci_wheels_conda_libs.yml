# Partial distributions of scikit-plots (libs/<name>): build every wheel and
# source distribution, and upload them to the Anaconda.org staging index.
#
# The counterpart of ci_wheels_conda.yml for the distributions under libs/
# (scikit-plots-skinny, scikit-plots-rank-bm25, ..., see libs/README.md).
#
#   https://pypi.anaconda.org/scikit-plots-wheels-staging-nightly/simple/
#   https://pypi.anaconda.org/scikit-plots-wheels-staging/simple/
#
# From there ci_wheels_(test)pypi.yml publishes one distribution at a time
# (its `distribution` input).
#
# WHAT IS BUILT
#
#   pure     One job. Every distribution's sdist, and the `py3-none-any` wheel
#            of every pure-Python one. A pure wheel is the same file on every
#            platform and every Python, Pyodide included, so it is built once.
#   annoy    One job per platform. scikit-plots-annoy is the one compiled
#            distribution; cibuildwheel builds it for each CPython it
#            supports, *from the sdist the pure job produced*, so every
#            published wheel is proof that the published sdist builds.
#            Platforms: manylinux and musllinux (x86_64, aarch64), macOS
#            (x86_64, arm64), Windows (AMD64, ARM64).
#   pyodide  One job per Pyodide release, the same rows as
#            ci_wheels_emscripten.yml: scikit-plots-annoy for WebAssembly
#            (Pyodide, JupyterLite), built without threads.
#   upload   One job, the only one that sees the upload tokens.
#
# WHEN IT RUNS (the same rules as ci_wheels_conda.yml)
#
#   schedule, workflow_dispatch        build, upload to ...-staging-nightly
#   push with "[wheel build]" in the   build, upload to ...-staging
#     commit message (main,
#     maintenance/**, v* tags)
#   pull_request with "[wheel build]"  build only; nothing is uploaded
#
# TWO TIERS
#
#   A platform is *required* once it has built and passed here; until then it
#   is *experimental*: it is built, tested and uploaded when it succeeds, and
#   a failure is shown in the run without stopping the upload of the others.
#   Promote a row by deleting its `experimental` mark after its first green
#   run. Required now: the five platforms ci_libs_partial_distributions.yml
#   and ci_wheels_conda.yml already build on.
#
# THREADS
#
#   `build(n_trees, n_jobs=N)` of the Annoy index can use N threads only when
#   the wheel was compiled with them (SKPLT_BUILD_THREADS=1, see
#   libs/annoy/setup.py); otherwise `n_jobs` is accepted and has no effect.
#   What a build does in a wheel that has them is the user's choice at run
#   time (SKPLT_ANNOY_THREADS: auto, single, multi), and with one thread the
#   index is the same in both kinds of wheel. The build default is without,
#   as in the full distribution's build. Here:
#
#     schedule, workflow_dispatch (nightly index)   with threads
#     push with "[wheel build]" (staging index)     without
#     Pyodide                                       without, always
#
#   so the nightly wheels are where it can be tried, and a release keeps
#   today's behaviour until the default changes (libs/_tools/registry.py,
#   `_ANNOY_THREADS_MACRO`, lists what is open). Each wheel's test asserts
#   that it was compiled the way this run asked for.
#
# NOT VERIFIED BEFORE THE FIRST RUN
#
#   The build commands are the ones `python -m libs._tools verify` runs on
#   Linux, macOS and Windows in ci_libs_partial_distributions.yml. The
#   cibuildwheel settings below (building from an sdist path, the test
#   environment, every experimental row, the whole Pyodide job) have not been
#   run anywhere yet; the first dispatch is their test.
---
name: "CI 📦 Wheels Conda (libs)"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - maintenance/**
    paths:
      - ".github/workflows/ci_wheels_conda_libs.yml"
      - "libs/**"
  push:
    branches:
      - main
      - maintenance/**
    tags:
      - v*
  schedule:
    # Mondays 12:12 UTC, one hour after ci_wheels_conda.yml, so that the two
    # do not compete for runners.
    - cron: "12 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

# No job needs more than read access to the repository. The upload tokens are
# repository secrets and are named only in the `upload` job.
permissions:
  contents: read

jobs:
  check_build_trigger:
    name: "Check build trigger by commit message"
    runs-on: ubuntu-latest
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'scikit-plots/scikit-plots'
    outputs:
      COMMIT_MESSAGE: ${{ steps.id_commit_message.outputs.COMMIT_MESSAGE }}
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # The commit of the pull request, not the merge commit made for it.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: "🔎 Look for [wheel build] in the last commit message"
        id: id_commit_message
        run: |
          set -e
          COMMIT_MSG=$(git log --no-merges -1 --oneline)
          echo "Last commit: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"[wheel build]"* ]]; then
            echo "COMMIT_MESSAGE=true" >> "$GITHUB_OUTPUT"
          fi

  build_pure:
    name: "Build · sdists and pure-Python wheels"
    needs: check_build_trigger
    runs-on: ubuntu-latest
    if: >-
      contains(needs.check_build_trigger.outputs.COMMIT_MESSAGE, 'true') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "📦 Install the build front end"
        run: python -m pip install build twine

      - name: "🔎 Generated packaging files are up to date"
        run: python -m libs._tools check

      # `build` makes each sdist from the repository and each wheel *from that
      # sdist*. For scikit-plots-annoy it also makes a wheel for this runner's
      # own interpreter and platform (`...-linux_x86_64.whl`): that tag is not
      # a distributable one, and the `annoy` job builds the real wheels, so it
      # is removed here.
      - name: "🏗️ Build every sdist and every pure wheel"
        run: |
          python -m libs._tools build --outdir dist/libs
          rm -f dist/libs/*-linux_*.whl
          ls -l dist/libs

      - name: "🧪 The metadata renders on the package index"
        run: python -m twine check --strict dist/libs/*.whl dist/libs/*.tar.gz

      - name: "📤 Keep the distributions for the other jobs"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libs-pure
          path: |
            dist/libs/*.whl
            dist/libs/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build_annoy:
    name: "Build · scikit-plots-annoy · ${{ matrix.buildplat[1] }}_${{ matrix.buildplat[2] }}"
    needs: build_pure
    runs-on: ${{ matrix.buildplat[0] }}
    # An experimental platform reports its failure and does not stop the run.
    continue-on-error: ${{ matrix.buildplat[4] == 'experimental' }}
    env:
      # "1" for the nightly index, "0" for the staging index.
      ANNOY_THREADS: >-
        ${{
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch') && '1' || '0'
        }}
    strategy:
      # A platform that fails does not stop the others from finishing.
      fail-fast: false
      matrix:
        # [runner, cibuildwheel platform, architecture, macOS deployment
        #  target, tier]
        # The runners are the ones ci_wheels_conda.yml uses for the same
        # platforms. macOS 10.15 is the first with the C++17 library features
        # the vendored Annoy sources use (the full build sets the same floor).
        buildplat:
          - [ubuntu-22.04, manylinux, x86_64, "", required]
          - [ubuntu-24.04-arm, manylinux, aarch64, "", required]
          - [macos-15-intel, macosx, x86_64, "10.15", required]
          - [macos-14, macosx, arm64, "11.0", required]
          - [windows-2022, win, AMD64, "", required]
          # Not built anywhere yet. The test step installs NumPy and
          # scikit-learn for the platform; where no wheel of them exists for
          # a Python, that row fails in the test, which is the information.
          - [ubuntu-22.04, musllinux, x86_64, "", experimental]
          - [ubuntu-24.04-arm, musllinux, aarch64, "", experimental]
          - [windows-11-arm, win, ARM64, "", experimental]
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "📥 Fetch the sdist and the core wheel"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libs-pure
          path: dist/libs

      - name: "🔎 Locate the scikit-plots-annoy sdist"
        id: sdist
        shell: bash
        run: |
          set -e
          count=$(ls dist/libs/scikit_plots_annoy-*.tar.gz | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one scikit-plots-annoy sdist, found $count" >&2
            exit 1
          fi
          echo "path=$(ls dist/libs/scikit_plots_annoy-*.tar.gz)" >> "$GITHUB_OUTPUT"

      # cibuildwheel reads `requires-python` from the sdist and builds for
      # every CPython it admits; nothing here names a Python version, so a new
      # CPython is picked up when cibuildwheel knows it.
      - name: "🏗️ Build and test the wheels"
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp*-${{ matrix.buildplat[1] }}*"
          CIBW_ARCHS: ${{ matrix.buildplat[2] }}
          # Free-threaded builds are left out until the part's tests have been
          # run on one.
          CIBW_SKIP: "cp3??t-*"
          CIBW_BUILD_FRONTEND: build
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.buildplat[3] }}
          # See THREADS at the top of this file. On Linux the build runs in a
          # container, which only sees what CIBW_ENVIRONMENT hands it.
          SKPLT_BUILD_THREADS: ${{ env.ANNOY_THREADS }}
          CIBW_ENVIRONMENT: SKPLT_BUILD_THREADS=${{ env.ANNOY_THREADS }}
          # The wheel requires scikit-plots-skinny, which is on no index yet:
          # it is installed first, from the wheel the pure job put in
          # dist/libs. Not through {project}: package-dir is the sdist, and
          # cibuildwheel builds an sdist by extracting it and changing into
          # it, so {project} is the extracted sdist, which has no dist/libs
          # ("Location '/project/dist/libs' is ignored" in the first run).
          # The directory is named by its host path instead. On Linux the
          # build runs in a container, where cibuildwheel mounts the host's
          # root at /host; elsewhere the build runs on the host itself.
          # ⚠️ numpy on win ARM may not support latest version
          CIBW_BEFORE_TEST: >-
            ${{ (format('{0}_{1}', matrix.buildplat[1], matrix.buildplat[2]) == 'win_ARM64')
            && 'pip install "numpy<2.3.0" && '
            || '' }}
            pip install --no-index --find-links
            ${{ (matrix.buildplat[1] == 'manylinux' || matrix.buildplat[1] == 'musllinux')
            && format('/host{0}/dist/libs', github.workspace)
            || format('{0}/dist/libs', github.workspace) }}
            scikit-plots-skinny
          # Outside the repository, so that `scikitplot` is the installed one:
          # the installation is coherent, and an index can be built and asked.
          CIBW_TEST_COMMAND: >-
            python -m scikitplot doctor &&
            python -c "from scikitplot.annoy import Index;
            from scikitplot.annoy import threads_info;
            index = Index(3, 'angular');
            index.add_item(0, [1.0, 0.0, 0.0]);
            index.add_item(1, [0.0, 1.0, 0.0]);
            index.build(10, n_jobs=2);
            assert index.get_nns_by_item(0, 2) == [0, 1];
            threads = threads_info()['compiled'];
            assert threads is (${{ env.ANNOY_THREADS }} == 1), threads"

      - name: "📤 Keep the wheels for the upload job"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libs-annoy-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  build_annoy_pyodide:
    name: >-
      Build · scikit-plots-annoy · ${{ matrix.python }} ×
      Pyodide-v${{ matrix.pyodide_version }} [${{ matrix.whl_tag }}]
    needs: build_pure
    runs-on: ${{ matrix.build_platform }}
    # Experimental as a whole: see TWO TIERS at the top of this file.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # The rows of ci_wheels_emscripten.yml that are not allowed to fail
        # there: the Pyodide release decides the cibuildwheel series, and the
        # series decides the wheel tag (v3: pyodide_*, v4: pyemscripten_*).
        include:
          - python: "cp312"
            pyodide_version: "0.29.4"
            build_platform: "ubuntu-22.04"
            cibw_series: "v3"
            whl_tag: "pyodide_2024_0_wasm32"
          - python: "cp313"
            pyodide_version: "0.29.4"
            build_platform: "ubuntu-22.04"
            cibw_series: "v3"
            whl_tag: "pyodide_2025_0_wasm32"
          - python: "cp313"
            pyodide_version: "314.0.0"
            build_platform: "ubuntu-24.04"
            cibw_series: "v4"
            whl_tag: "pyemscripten_2025_0_wasm32"
          - python: "cp314"
            pyodide_version: "314.0.0"
            build_platform: "ubuntu-24.04"
            cibw_series: "v4"
            whl_tag: "pyemscripten_2026_0_wasm32"
    env:
      CIBW_PLATFORM: pyodide
      CIBW_BUILD: "${{ matrix.python }}-*"
      CIBW_ENABLE: "pypy-eol"
      CIBW_BUILD_FRONTEND: build
      # A WebAssembly interpreter has one thread. The build would leave the
      # multithreaded code out by itself when it recognises the target; it is
      # stated here so that it does not depend on that recognition.
      CIBW_ENVIRONMENT: SKPLT_BUILD_THREADS=0
      # The host path, not {project}: see "Build and test the wheels" above.
      # Pyodide builds and tests on the host.
      CIBW_BEFORE_TEST: >-
        pip install --no-index --find-links ${{ github.workspace }}/dist/libs
        scikit-plots-skinny
      CIBW_TEST_COMMAND: >-
        python -c "from scikitplot.annoy import Index;
        index = Index(3, 'angular');
        index.add_item(0, [1.0, 0.0, 0.0]);
        index.add_item(1, [0.0, 1.0, 0.0]);
        index.build(10);
        assert index.get_nns_by_item(0, 2) == [0, 1];
        from scikitplot.annoy import threads_info;
        threads = threads_info()['compiled'];
        assert threads is False, threads"
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "📥 Fetch the sdist and the core wheel"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libs-pure
          path: dist/libs

      - name: "🔎 Locate the scikit-plots-annoy sdist"
        id: sdist
        run: |
          set -e
          count=$(ls dist/libs/scikit_plots_annoy-*.tar.gz | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one scikit-plots-annoy sdist, found $count" >&2
            exit 1
          fi
          echo "path=$(ls dist/libs/scikit_plots_annoy-*.tar.gz)" >> "$GITHUB_OUTPUT"

      # Exactly one of the two build steps runs: the cibuildwheel series is
      # tied to the Pyodide release (see ci_wheels_emscripten.yml).
      - name: "🏗️ Build and test · cibuildwheel v3"
        if: matrix.cibw_series == 'v3'
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse

      - name: "🏗️ Build and test · cibuildwheel v4"
        if: matrix.cibw_series == 'v4'
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse

      - name: "🔎 The wheel has the expected tag"
        env:
          WHL_TAG: ${{ matrix.whl_tag }}
        run: |
          set -e
          ls -l wheelhouse
          count=$(ls wheelhouse/*-"$WHL_TAG".whl | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one *-$WHL_TAG.whl, found $count" >&2
            exit 1
          fi

      - name: "📤 Keep the wheel for the upload job"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libs-annoy-pyodide-${{ matrix.python }}-${{ matrix.pyodide_version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  upload:
    name: "Upload to the Anaconda.org staging index"
    # A failed experimental job counts as finished here (continue-on-error),
    # and it kept no artifact, so only what was built and tested is uploaded.
    needs: [check_build_trigger, build_pure, build_annoy, build_annoy_pyodide]
    runs-on: ubuntu-latest
    # Never for a pull request: its code is not trusted with the tokens.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
       contains(needs.check_build_trigger.outputs.COMMIT_MESSAGE, 'true'))
    env:
      # Read by tools/wheels/upload_wheels.sh (set_upload_vars), exactly as in
      # ci_wheels_conda.yml: a push goes to ...-staging, a scheduled or manual
      # run to ...-staging-nightly.
      IS_PUSH: >-
        ${{
          contains(needs.check_build_trigger.outputs.COMMIT_MESSAGE, 'true') &&
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/heads/main') ||
           startsWith(github.ref, 'refs/tags/v') ||
           contains(github.ref, 'maintenance')
          )
        }}
      IS_SCHEDULE_DISPATCH: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        }}
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every artifact of this run: the pure job's distributions and each
      # platform's wheels, side by side in one directory.
      - name: "📥 Collect every distribution"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libs-*
          path: wheelhouse
          merge-multiple: true

      - name: "🔎 What will be uploaded"
        run: |
          set -e
          ls -l wheelhouse
          # One sdist per distribution under libs/, or the run is incomplete.
          expected=$(ls -d libs/*/pyproject.toml | wc -l)
          found=$(ls wheelhouse/*.tar.gz | wc -l)
          if [ "$expected" -ne "$found" ]; then
            echo "expected $expected sdists, found $found" >&2
            exit 1
          fi

      - name: "🐍 Conda environment for anaconda-client"
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          python-version: "3.11"
          show-channel-urls: true
          miniforge-version: latest
          channels: conda-forge,defaults
          channel-priority: strict

      - name: "📥 Upload to Anaconda.org"
        # See https://github.com/marketplace/actions/setup-miniconda for why
        # `-el {0}` is required.
        shell: bash -el {0}
        env:
          SKPLT_STAGING_UPLOAD_TOKEN: ${{ secrets.SKPLT_STAGING_UPLOAD_TOKEN }}
          SKPLT_STAGING_UPLOAD_TOKEN_NIGHTLY: ${{ secrets.SKPLT_STAGING_UPLOAD_TOKEN_NIGHTLY }}
          ARTIFACTS_PATH: wheelhouse
        run: |
          source tools/wheels/upload_wheels.sh
          set_upload_vars  # TOKEN and USERNAME, from IS_PUSH / IS_SCHEDULE_DISPATCH
          upload_wheels    # everything in ARTIFACTS_PATH
